# Log rotation for bigBangEnv autonomous trace and system logs
# Install to: /etc/logrotate.d/bigbang

/var/lib/bigbang/state/trace.jsonl {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    maxsize 100M
    su bigbang bigbang
}

/var/log/bigbang/*.log {
    weekly
    rotate 8
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
