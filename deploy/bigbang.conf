# Configuration for bigBangEnv daemon (/etc/bigbang/bigbang.conf)

# State directory: holds snapshot.json, host.json, ledger.json, trace.jsonl, config.json
BIGBANG_STATE_DIR=/var/lib/bigbang/state

# Sensor inputs directory for unprivileged incoming issues/events (*.json)
BIGBANG_ISSUES_DIR=/var/lib/bigbang/issues

# Privileged owner command stream file (e.g. close, reopen, label)
BIGBANG_COMMANDS_FILE=/var/lib/bigbang/commands.txt

# Tick interval in seconds (e.g. 1.0 for 1 tick per second; 0.1 for high frequency)
BIGBANG_INTERVAL=1.0

# Organism Brain Lineage:
#   rule    : Fast deterministic keyword heuristics (Free, ~0% CPU, no API)
#   free    : Local Qwen2.5-1.5B model with answer cache (Free, CPU inference)
#   local   : Local model without rule fallback
#   cascade : Local model with capped Claude fallback (requires ANTHROPIC_API_KEY)
BIGBANG_BRAIN=rule

# Organism architecture:
#   body      : Full 5-organ unified Body (Perception, Action, Memory+M2, Defense, Deliberation)
#   caretaker : Legacy M1 flat caretaker organism
BIGBANG_ORGANISM=body
BIGBANG_ROLE=general

# Optional extra flags (e.g. "--no-reflex" or "--claude-max-calls 50")
BIGBANG_EXTRA_ARGS=""
