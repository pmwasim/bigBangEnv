[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigbang"
version = "0.1.0"
description = "bigBangEnv: a runtime where agents live rather than run"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic"]
dev = ["pytest>=8"]

[project.scripts]
bigbang = "bigbang.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
