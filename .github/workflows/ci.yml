name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: M1 evaluation (exit criteria)
        run: bigbang eval --out evaluation.md
      - name: Operations walkthrough
        run: examples/caretaker/operate.sh "$RUNNER_TEMP/caretaker"
      - name: Upload evaluation report
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: evaluation.md
